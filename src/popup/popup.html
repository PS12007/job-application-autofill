<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workday Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="title">Workday Autofill</span>
      <span id="step" class="step">—</span>
    </header>

    <button id="fill" class="primary" disabled>Fill this page</button>
    <div class="row">
      <button id="dump" disabled>Dump fields (debug)</button>
      <button id="settings">Profile settings</button>
    </div>

    <label class="toggle"><input type="checkbox" id="overwrite" /> Overwrite existing values</label>
    <label class="toggle" title="After a clean step, clicks Next and fills the next one. Stops at Review, on any failed or empty required field, and never clicks Submit."><input type="checkbox" id="autoAdvance" /> Auto-advance through steps</label>
    <label class="toggle"><input type="checkbox" id="debug" /> Debug logging (console)</label>

    <div id="status" class="status">Loading…</div>
    <ul id="details" class="details"></ul>
    <textarea id="dumpOut" class="dump" hidden readonly></textarea>

    <script src="../shared/defaults.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

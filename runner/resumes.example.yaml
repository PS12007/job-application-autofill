# Pick a different resume per job. Copy to resumes.yaml (apply.py does this on the first
# run), put your PDFs in runner/resumes/, and set each track's "file".
#
# How a job is scored against each track:
#   +5 for each "titles" phrase found in the job title (the sheet's Role column + the page's job title)
#   +2 for each "keywords" word found in the job title
#   +1 for each "keywords" word found in the job description (at most `description_cap` points)
# The highest score wins. Below `min_score`, or if the track's file doesn't exist yet,
# the default resume (resumePath in profile.json) is used. Ties go to the track listed first,
# so specific tracks come before general ones.
#
# Override per job: add a "Resume" column to the sheet and put a track name (e.g. ml) or a
# file path in it. The chosen track is noted in the row's Notes as [resume: name].
#
# Matching ignores case and only matches whole words ("ml" doesn't match "html").
# Delete tracks you don't need; add your own the same way.
#
# Cover letters (optional): give a track `cover_letter: cover_letters/ml.pdf`, and/or set
# default_cover_letter below. It's uploaded only where the form has a cover letter upload.
#
# The keywords also drive the ATS keyword gap in Notes ("82% keyword match, missing: ...").

min_score: 4
description_cap: 12
use_description: true
default_cover_letter: ""      # e.g. cover_letters/general.pdf

tracks:
  ml:
    file: resumes/ml.pdf
    # cover_letter: cover_letters/ml.pdf
    titles: [machine learning, ml engineer, mle, ai engineer, artificial intelligence, deep learning, applied scientist,
             research scientist, computer vision, nlp, natural language, llm, generative ai, genai, perception engineer,
             ml ops, mlops, ml infrastructure, ai/ml, ml platform, speech, recommender, ranking engineer]
    keywords: [pytorch, tensorflow, jax, keras, scikit-learn, sklearn, huggingface, hugging face, transformers, llm, llms,
               large language model, rag, retrieval augmented, fine-tuning, fine tuning, prompt engineering, embeddings,
               vector database, langchain, cuda, triton, onnx, tensorrt, model training, model serving, inference,
               neural network, neural networks, cnn, rnn, lstm, reinforcement learning, computer vision, opencv,
